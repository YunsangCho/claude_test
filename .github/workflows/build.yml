name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # CLAUDE.md 의 명령 두 개를 그대로 돌린다.  check 가 실패하면 여기서 멈춘다.
      - name: build
        run: python scripts/build.py

      - name: check
        run: node scripts/check.mjs

      - name: 결과물 보관
        uses: actions/upload-artifact@v4
        with:
          name: korean-history-cards
          path: dist/한국사-카드덱.html
          if-no-files-found: error

      # 앱은 외부 파일을 하나도 참조하지 않는 단일 HTML 이라
      # Pages 하위 경로에 올려도 링크가 깨지지 않는다.
      # index.html 은 바로 열기용, 한글 이름 파일은 폰에 저장할 때 이름이 제대로 붙게 하려는 것이다.
      - name: 사이트 파일 준비
        run: |
          mkdir -p _site
          cp "dist/한국사-카드덱.html" "_site/index.html"
          cp "dist/한국사-카드덱.html" "_site/한국사-카드덱.html"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # 기본 브랜치에 올라간 것만 배포한다.  브랜치 이름을 바꿔도 따라간다.
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # enablement 로 Pages 를 켜 본다.  권한이 없으면 여기서 실패하니
      # 그때는 저장소 Settings 에서 Source 를 GitHub Actions 로 한 번 바꿔 주면 된다.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - id: deploy
        uses: actions/deploy-pages@v4
